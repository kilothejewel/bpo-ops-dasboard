dbt_bpo:
  target: dev
  outputs:
    dev:
      type: postgres
      # Same POSTGRES_* variables as scripts/generate_data.py and the dashboard
      # (see "Environment Variables" in the root README). Defaults are dev-only.
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'postgres') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD', 'postgres') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'bpo_db') }}"
      schema: public
      threads: 4
