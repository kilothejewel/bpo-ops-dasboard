name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  pipeline:
    name: Pipeline (generate data, dbt build + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bpo_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bpo_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: bpo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Bronze — generate synthetic data
        run: python scripts/generate_data.py
      - name: Silver/Gold — dbt deps + build (models and all data tests)
        working-directory: dbt_bpo
        run: |
          dbt deps --profiles-dir .
          dbt build --profiles-dir .
      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            dbt_bpo/target/run_results.json
            dbt_bpo/target/manifest.json
            dbt_bpo/logs/dbt.log
          if-no-files-found: ignore

  compose:
    name: Docker Compose end-to-end
    runs-on: ubuntu-latest
    needs: [dashboard, pipeline]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build -d
      - name: Wait for the dashboard to become healthy
        run: |
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' bpo-ops-dashboard-1 2>/dev/null)" = "healthy" ]; then
              echo "dashboard healthy"; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' bpo-ops-pipeline-1 2>/dev/null)" = "exited 1" ]; then
              echo "pipeline failed"; exit 1
            fi
            sleep 5
          done
          echo "timed out waiting for dashboard"; exit 1
      - name: Smoke-test the API
        run: |
          set -eu
          curl -fsS -c cookies -X POST localhost:3000/api/session \
            -H 'content-type: application/json' -d '{"userId":"mgmt-exec"}' > /dev/null
          total=$(curl -fsS -b cookies localhost:3000/api/dashboard | python3 -c 'import json,sys; print(json.load(sys.stdin)["interactions"]["total"])')
          echo "interactions: $total"
          [ "$total" -gt 0 ]
          curl -fsS -b cookies localhost:3000/api/meta | python3 -c '
          import json, sys
          dbt = json.load(sys.stdin)["dbt"]
          print("dbt tests:", dbt["tests"])
          assert dbt["available"] and dbt["tests"]["total"] > 0 and dbt["tests"]["failed"] == 0
          '
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
